name: Deploy to GitHub Pages

# Publishes the static build to GitHub Pages so there is a public link to the
# site. This is a *static* deployment: the Express API in server.ts (enquiry
# mail, the live-chat websocket, the leads endpoint) does not run on Pages, so
# the contact forms are inert there. Use Vercel/Node for the full app.
#
# A project Pages site is served from https://<owner>.github.io/<repo>/, so the
# build is given VITE_BASE=/<repo>/ and scripts/apply-base.mjs rewrites the
# public-asset URLs the app hardcodes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build (static, sub-path base)
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build:pages

      - name: SPA fallback for deep links
        # Pages serves 404.html for unknown paths; the app routes on the
        # pathname, so handing it the app shell keeps /services/erp-audit
        # working on a refresh or a shared link.
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
