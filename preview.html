    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon-512x512.png" />

    <meta property="og:title" content="Coreenact - Microsoft Dynamics 365 Business Central Partner" />
    <meta property="og:description" content="Enterprise Microsoft Solutions Partner specializing in Microsoft Dynamics 365 Business Central implementations, NAV to Cloud migrations, India GST localization, and 24/7 managed support." />

    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Logic theme type pairing: Anton for display headings (uppercase, condensed)
      and Inter for body. Loaded through preload+onload rather than a blocking
      stylesheet link so first paint is not held up on throttled mobile;
      display=swap plus the system fallback stack in index.css keeps text
      readable immediately.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap"
      />
    </noscript>
  </head>

  </body>
